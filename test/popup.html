<!doctype html>
<meta charset="utf-8">
<title>Makieta – okienko wtyczki</title>
<script>
  // Ładuje prawdziwe popup.html wtyczki, ale z podmienionym API chrome.* (chrome-shim.js).
  (async () => {
    const page = new URLSearchParams(location.search).get('page') || 'popup';
    let html = await (await fetch('../extension/' + page + '/' + page + '.html')).text();
    html = html.replace('<head>', '<head><base href="/extension/' + page + '/"><script src="/test/chrome-shim.js"><\/script>');
    document.open();
    document.write(html);
    document.close();
  })();
</script>
